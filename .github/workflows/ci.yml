name: Project hub checks
on:
  push:
    branches: [main, 'jinx/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: JinxOnPurpose-Labs/pocket-wild
          ref: e68a46ce0995747ae1cc81699e731fc1c7f9671c
          path: _sources/pocket-wild
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test && npm run build && npm audit --audit-level=high
        env:
          POCKET_WILD_DIR: _sources/pocket-wild
